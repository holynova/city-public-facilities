<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">近邻 — 城市公共地点近邻检索：输入地址，查看每类最近地点</title>
  <desc id="desc">深青底明黄点缀的标题：近邻，城市公共地点近邻检索；右侧是人民公园的查询结果卡：上海体育博物馆 220 米，分类有博物馆、美术馆、地铁站、三甲医院。</desc>

  <rect width="1200" height="360" rx="26" fill="#122a33"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#f5c518">城市公共地点近邻检索 · NEARBY PUBLIC FACILITIES</text>
    <text x="56" y="128" font-size="58" font-weight="700" fill="#f5f5f4">近邻</text>
    <text x="56" y="168" font-size="23" fill="#e7e5e4">输入地址，查看每类最近的公共地点</text>
    <text x="56" y="204" font-size="19" fill="#b8c4c7">15 个城市 · 28,715 处地点 · 直线距离</text>
    <g id="chips" font-size="18" fill="#f5f5f4" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#1d3a44" stroke="#3a5a66" stroke-width="1.5"/><text x="119" y="262">15 个城市</text></g>
      <g><rect x="194" y="238" width="150" height="36" rx="18" fill="#1d3a44" stroke="#3a5a66" stroke-width="1.5"/><text x="269" y="262">28,715 处地点</text></g>
      <g><rect x="356" y="238" width="126" height="36" rx="18" fill="#1d3a44" stroke="#3a5a66" stroke-width="1.5"/><text x="419" y="262">8 大分类</text></g>
      <g><rect x="494" y="238" width="150" height="36" rx="18" fill="#f5c518"/><text x="569" y="262" fill="#122a33">每类最近 3 处</text></g>
    </g>
  </g>

  <g id="result" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="780" y="44" width="360" height="272" rx="16" fill="#ffffff"/>
    <g id="result-shapes">
      <rect x="804" y="60" width="312" height="48" rx="8" fill="#f0f4f5"/>
      <rect x="804" y="196" width="98" height="36" rx="18" fill="#f0f4f5"/>
      <rect x="914" y="196" width="98" height="36" rx="18" fill="#f0f4f5"/>
      <rect x="1024" y="196" width="92" height="36" rx="18" fill="#f0f4f5"/>
      <rect x="804" y="244" width="98" height="36" rx="18" fill="#f0f4f5"/>
      <rect x="914" y="244" width="98" height="36" rx="18" fill="#f0f4f5"/>
      <rect x="1024" y="244" width="92" height="36" rx="18" fill="#fff7d6" stroke="#f5c518" stroke-width="1.5"/>
    </g>
    <g id="result-labels">
      <text x="820" y="91" font-size="19" fill="#122a33">人民公园</text>
      <text x="1100" y="91" font-size="19" fill="#854d0e" text-anchor="end">搜索</text>
      <text x="804" y="148" font-size="19" font-weight="700" fill="#122a33">博物馆</text>
      <text x="804" y="180" font-size="19" fill="#44403c">上海体育博物馆</text>
      <text x="1116" y="180" font-size="19" font-weight="700" fill="#122a33" text-anchor="end">220 m</text>
      <text x="853" y="220" font-size="18" fill="#44403c" text-anchor="middle">博物馆</text>
      <text x="963" y="220" font-size="18" fill="#44403c" text-anchor="middle">美术馆</text>
      <text x="1070" y="220" font-size="18" fill="#44403c" text-anchor="middle">地铁站</text>
      <text x="853" y="268" font-size="18" fill="#44403c" text-anchor="middle">图书馆</text>
      <text x="963" y="268" font-size="18" fill="#44403c" text-anchor="middle">三甲医院</text>
      <text x="1070" y="268" font-size="18" fill="#854d0e" text-anchor="middle">市级公园</text>
    </g>
  </g>
</svg>
