  <text x="60" y="190" fill="#78979a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">输入地址，按类别查找附近的公共设施，并比较直线距离。数据为人工更新的目录快照，适合先筛选地点，再核实开放与服务信息。</text>
